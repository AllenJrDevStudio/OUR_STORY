<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4b79a1, #283e51);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 640px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
    }
    h1 {
      margin: 0 0 16px;
      font-size: 3rem;
      letter-spacing: 1px;
    }
    p {
      margin: 0;
      line-height: 1.6;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Our Story</h1>
    <p>Discover the journey, the moments, and the people behind our story. Start exploring and enjoy the experience.</p>
  </div>
</body>
</html>
